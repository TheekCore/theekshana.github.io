<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theekshana Thathsara — UI/UX &amp; Full-Stack Developer</title>
<meta name="description" content="Portfolio of Theekshana Thathsara, BICT (Hons) undergraduate, UI/UX enthusiast and aspiring full-stack developer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --bg-0:#070B14;
  --bg-1:#0D1220;
  --bg-2:#111830;
  --violet:#7C6CF6;
  --violet-soft:#9B8CFF;
  --cyan:#35D0E8;
  --amber:#FFB454;
  --text-0:#EAECF3;
  --text-1:#AEB4C7;
  --text-2:#767E96;
  --glass-bg:rgba(255,255,255,0.045);
  --glass-bg-hi:rgba(255,255,255,0.08);
  --glass-border:rgba(255,255,255,0.12);
  --glass-border-hi:rgba(255,255,255,0.22);
  --radius:18px;
  --font-display:'Sora',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}

*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg-0);
  color:var(--text-0);
  font-family:var(--font-body);
  line-height:1.6;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%; display:block;}
a{color:inherit; text-decoration:none;}
ul{list-style:none;}
button{font-family:inherit; cursor:pointer;}

::selection{background:var(--violet); color:#fff;}

/* focus visibility for accessibility */
a:focus-visible, button:focus-visible{
  outline:2px solid var(--cyan);
  outline-offset:3px;
  border-radius:6px;
}

.eyebrow{
  font-family:var(--font-mono);
  font-size:0.78rem;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:var(--cyan);
  display:inline-flex;
  align-items:center;
  gap:0.5em;
  margin-bottom:1rem;
}
.eyebrow::before{
  content:'';
  width:22px; height:1px;
  background:var(--cyan);
  display:inline-block;
}

h1,h2,h3{font-family:var(--font-display); color:#fff; line-height:1.15;}

.section-title{
  font-size:clamp(1.8rem, 4vw, 2.6rem);
  font-weight:700;
  margin-bottom:0.6rem;
}
.section-sub{
  color:var(--text-1);
  max-width:56ch;
  margin-bottom:3rem;
  font-size:1.02rem;
}

.container{
  max-width:1180px;
  margin:0 auto;
  padding:0 clamp(1.25rem, 5vw, 3rem);
}
section{
  position:relative;
  padding:clamp(4rem, 9vw, 7rem) 0;
}

</style>
</head>
<body>

</body>
</html>
